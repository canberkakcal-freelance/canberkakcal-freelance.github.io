<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canberk Akçal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background-color: #00FF00; /* Canlı Yeşil Arka Plan */
            color: #000000; /* Siyah Yazılar */
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            padding: 20px;
        }

        /* Üst Menü (Contact & Instagram) */
        .nav-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 1.1rem;
            font-weight: 500;
        }

        .nav-bar a {
            color: #000000;
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .nav-bar a:hover {
            opacity: 0.6;
        }

        /* Orta Alan: Kayan Yazı Konteyneri */
        .marquee-container {
            width: 100vw;
            margin-left: -20px; /* Ekranı tam kaplaması için */
            overflow: hidden;
            white-space: nowrap;
            display: flex;
            align-items: center;
        }

        /* Sonsuz Döngü Kayan Yazı Efekti */
        .marquee-text {
            font-size: 15vw; /* Ekran boyutuna göre otomatik büyür/küçülür (Responsive) */
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -2px;
            display: inline-block;
            padding-left: 100%;
            animation: marquee 15s linear infinite;
        }

        @keyframes marquee {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        /* Alt Alan: Durum Metni */
        .footer-text {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        /* Mobil Ekranlar İçin İnce Ayarlar */
        @media (max-width: 600px) {
            body { padding: 15px; }
            .nav-bar { font-size: 1rem; }
            .footer-text { font-size: 1.2rem; }
            .marquee-text { font-size: 22vw; animation-duration: 10s; } /* Mobilde daha büyük ve ideal hızda */
        }
    </style>
</head>
<body>

    <!-- Üst Menü Linkleri -->
    <div class="nav-bar">
        <a href="mailto:canberkakcal@gmail.com">✉ Contact</a>
        <a href="https://www.instagram.com/canberk.akcal/" target="_blank">Instagram</a>
    </div>

    <!-- Kayan Canberk Akçal Yazısı -->
    <div class="marquee-container">
        <div class="marquee-text">Canberk Akçal — Canberk Akçal —</div>
    </div>

    <!-- Alt Metin -->
    <div class="footer-text">
        Website In Making...
    </div>

</body>
</html>
