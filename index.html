<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Canberk Akçal</title>
    <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAn0lEQVR42mNkQAIsF7v/M5Agw6WOfwwMWE0g1ABybMAwAAn8P8wA0vof6gB0v0GegIsL0f0GegIQb8D/w7v+M4DofgM9Asg3gNidvIDoN9BDgHwDSDbA8v7vfwYgH9H9BnoMkG8AmwXW967/9CAnw9gCmA+I3clnALX9D3EAuR8gZgG5LgDxAtYHYH0f9OALshywvXf9pwc5GeYFADbeWAt0pY84AAAAAElFTkSuQmCC">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background-color: #00FF00; 
            color: #000000; 
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            height: 100vh;
            height: 100dvh; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            padding: 20px;
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 1.1rem;
            font-weight: 500;
            z-index: 10;
        }

        .nav-bar a {
            color: #000000;
            text-decoration: none;
            transition: opacity 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px; 
        }

        /* Çizgisel İkonların Ortak Boyut Ayarı */
        .nav-icon {
            width: 24px;
            height: 24px;
            stroke: #000000;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .nav-bar a:hover {
            opacity: 0.6;
        }

        .marquee-container {
            width: 100vw;
            margin-left: -20px;
            overflow: hidden;
            white-space: nowrap;
            display: flex;
            align-items: center;
        }

        .marquee-wrapper {
            display: inline-flex;
            animation: marquee 20s linear infinite;
        }

        .marquee-text {
            font-size: 12vw; 
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -1px;
            padding-right: 60px; 
        }

        @keyframes marquee {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-50%, 0, 0); } 
        }

        .footer-text {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
            z-index: 10;
        }

        @media (max-width: 600px) {
            body { padding: 25px 20px; }
            .nav-bar { font-size: 1.1rem; } 
            .nav-icon { width: 22px; height: 22px; stroke-width: 2.2; } /* Mobilde görünürlük dengesi */
            .footer-text { font-size: 1.2rem; margin-bottom: 5px; }
            .marquee-text { font-size: 16vw; padding-right: 40px; }
            .marquee-wrapper { animation-duration: 12s; }
        }
    </style>
</head>
<body>

    <div class="nav-bar">
        <!-- Çizgisel Mektup Zarfı İkonu -->
        <a href="mailto:canberkakcal@gmail.com">
            <svg class="nav-icon" viewBox="0 0 24 24">
                <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                <path d="M22 6l-10 7L2 6"></path>
            </svg>
            Contact
        </a>
        
        <!-- Çizgisel Instagram Kamerası İkonu -->
        <a href="https://www.instagram.com/canberk.akcal/" target="_blank">
            <svg class="nav-icon" viewBox="0 0 24 24">
                <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
            </svg>
            Instagram
        </a>
    </div>

    <div class="marquee-container">
        <div class="marquee-wrapper">
            <span class="marquee-text">Canberk Akçal</span>
            <span class="marquee-text">Canberk Akçal</span>
            <span class="marquee-text">Canberk Akçal</span>
            <span class="marquee-text">Canberk Akçal</span>
        </div>
    </div>

    <div class="footer-text">
        Website In The Making...
    </div>

</body>
</html>
